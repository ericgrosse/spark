[build]
  command = "npm run netlify:build"
  publish = "apps/mobile/dist"

[build.environment]
  NODE_VERSION = "20"
  CI = "1"
  EXPO_NO_TELEMETRY = "1"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/metadata.json"
  [headers.values]
    Cache-Control = "public, max-age=60"
