[build]
  command = "npm run netlify:build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  CI = "1"
  EXPO_NO_TELEMETRY = "1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
